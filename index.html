<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/portfolio.svg"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta
      name="description"
      content="Explore my projects, skills, and experience as a developer."
    />
    <title>Davide Cipolla | Developer Portfolio</title>

    <script>
      (function () {
        const search = window.location.search;
          if (search.startsWith('?/')) {
            const parts = search.slice(2).split('&');

            const route = parts[0].replace(/~and~/g, '&');
            const query = parts.length > 1
                ? '?' + parts.slice(1)
                    .join('&')
                    .replace(/~and~/g, '&')
                : '';

            window.history.replaceState(
                null,
                '',
                '/my-website/' + route + query + window.location.hash
            );
          }
      })();

    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
